{% extends "account/base_manage_password.html" %}
{% block head_title %}Password{% endblock %}
{% block content %}
<h1>Password</h1>
<c-form-card id="password" action="{% url 'account_change_password' %}" submit="Change password">
  {{ redirect_field }}{{ form }}
  <c-slot name="footer"><a class="secondary-link text-sm" href="{% url 'account_reset_password' %}">Forgot your password?</a></c-slot>
</c-form-card>
{% endblock %}
