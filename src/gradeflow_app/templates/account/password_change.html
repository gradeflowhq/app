{% extends "account/base_manage_password.html" %}
{% block head_title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
{% url 'mfa_index' as security_url %}
<c-form-panel id="password" action="{% url 'account_change_password' %}" submit="Change password" cancel_url="{{ security_url }}" :disabled_until_script="True">
  {{ redirect_field }}{{ form }}
  <c-slot name="footer"><a class="muted-link text-sm" href="{% url 'account_reset_password' %}">Forgot your password?</a></c-slot>
</c-form-panel>
{% endblock %}
