{# Leaving a sign-in stage: to `cancel_url` where allauth gives one, otherwise by signing out of the stage. #}
{% if cancel_url %}<a class="secondary-link" href="{{ cancel_url }}">Cancel</a>{% else %}<form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'account_login' %}"><button class="secondary-link cursor-pointer">Cancel</button></form>{% endif %}
