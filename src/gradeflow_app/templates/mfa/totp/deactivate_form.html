{% extends "mfa/base_manage.html" %}
{% block head_title %}Authenticator app{% endblock %}
{% block content %}
<h1>Authenticator app</h1>
<c-panel>
  <form id="turn-off-totp" method="post" action="{% url 'mfa_deactivate_totp' %}" class="grid gap-3">
    {% csrf_token %}<c-form-errors :errors="form.non_field_errors" />
    <p class="text-muted">Signing in stops asking for a code from your app.</p>
  </form>
  <c-slot name="footer"><button form="turn-off-totp" class="btn btn-error btn-outline ml-auto">Turn off</button></c-slot>
</c-panel>
{% endblock %}
