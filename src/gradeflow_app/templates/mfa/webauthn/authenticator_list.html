{% extends "mfa/base_manage.html" %}
{% block head_title %}Passkeys{% endblock %}
{% block content %}
<h1>Passkeys</h1>
<c-panel body_class="setting-rows">
  {% for authenticator in authenticators %}
  <c-setting-row icon="finger-print" label="{{ authenticator }}" detail="{% if authenticator.last_used_at %}Last used {{ authenticator.last_used_at|ago }}{% else %}Not used yet{% endif %}">
    <c-menu id="passkey-menu-{{ authenticator.pk }}" label="Actions for {{ authenticator }}">
      <li><a href="{% url 'mfa_edit_webauthn' pk=authenticator.pk %}">Rename</a></li>
      <li><a class="text-error" href="{% url 'mfa_remove_webauthn' pk=authenticator.pk %}">Remove</a></li>
    </c-menu>
  </c-setting-row>
  {% empty %}
  <p class="py-4 text-muted">None yet</p>
  {% endfor %}
  <c-slot name="footer"><a class="btn ml-auto" href="{% url 'mfa_add_webauthn' %}">{% icon "plus" %}Add passkey</a></c-slot>
</c-panel>
{% endblock %}
