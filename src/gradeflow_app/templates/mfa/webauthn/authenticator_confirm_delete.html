{% extends "mfa/base_manage.html" %}
{% block head_title %}Remove passkey{% endblock %}
{% block content %}
<h1>Remove passkey</h1>
<c-panel>
  <form id="remove-passkey" method="post" action="{% url 'mfa_remove_webauthn' pk=authenticator.pk %}" class="grid gap-1">
    {% csrf_token %}
    <p class="font-medium">{{ authenticator }}</p>
    <p class="text-muted">You can't sign in with it after this.</p>
  </form>
  <c-slot name="footer"><a class="btn ml-auto" href="{% url 'mfa_list_webauthn' %}">Cancel</a><button form="remove-passkey" class="btn btn-error btn-outline">Remove</button></c-slot>
</c-panel>
{% endblock %}
