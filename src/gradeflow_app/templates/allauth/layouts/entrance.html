{% extends "allauth/layouts/base.html" %}
{% block body %}
<c-topbar />
<main id="main" class="mx-auto max-w-md px-6 py-14">
  <div class="card-box overflow-hidden">
    <div class="grid gap-6 p-8 [&_.btn]:w-full">{% block content %}{% endblock %}</div>
    <nav class="flex justify-center gap-6 border-t border-base-300 bg-base-200/50 px-8 py-4 text-sm empty:hidden" aria-label="Other ways in">{% block links %}{% endblock %}</nav>
  </div>
</main>
{% endblock %}
