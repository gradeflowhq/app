{% extends "base.html" %}
{# The account's settings pages. #}
{% block topbar %}
  <c-topbar tabs_label="Account">
    <c-slot name="nav"><ol class="flex min-w-0 items-center" aria-label="Breadcrumb"><c-breadcrumb href="{% url 'settings' %}" name="Account" icon="user-circle" current="true" /></ol></c-slot>
    <c-slot name="tabs">
      <c-tab href="{% url 'settings' %}" label="Profile" icon="user" sections="settings" />
      <c-tab href="{% url 'integrations' %}" label="Integrations" icon="link" sections="integrations" />
      <c-tab href="{% url 'mfa_index' %}" label="Security" icon="shield-check" sections="mfa_index account_change_password mfa_activate_totp mfa_deactivate_totp mfa_list_webauthn mfa_add_webauthn mfa_edit_webauthn mfa_remove_webauthn mfa_view_recovery_codes mfa_generate_recovery_codes" />
      <c-tab href="{% url 'usersessions_list' %}" label="Devices" icon="computer-desktop" sections="usersessions_list" />
    </c-slot>
  </c-topbar>
{% endblock %}
