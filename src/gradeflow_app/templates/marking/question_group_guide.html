<c-guide.dialog id="question-group-guide" title="Question groups" intro="Mark questions together when one answer's marks depend on another.">
  <p>A question is marked by its own marking or by one group, not both. A group can also use a question’s answer without marking it, as a Conditional’s <b>If</b> does. That question keeps its own marking.</p>
</c-guide.dialog>
