<select name="{{ widget.name }}" multiple{% include "django/forms/widgets/attrs.html" %}>{% for text, count in widget.selected %}<option value="{{ text }}"{% if count %} data-data='{"count": {{ count }}}'{% endif %} selected>{{ text }}</option>{% endfor %}{% for text, count in widget.suggestions %}<option value="{{ text }}" data-data='{"count": {{ count }}}'>{{ text }}</option>{% endfor %}</select>
