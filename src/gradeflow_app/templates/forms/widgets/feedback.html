{% if widget.as_text %}
<textarea class="textarea field-sizing-content min-h-20 w-full font-mono text-sm" rows="3" name="{{ widget.name }}-text"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{{ widget.value|default_if_none:'' }}</textarea>
{% else %}
<div class="grid gap-3"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>
  {% for case, value in widget.boxes %}
  <label class="grid gap-1"><span class="text-sm text-muted">{{ case.1 }}</span>
    <textarea class="textarea field-sizing-content min-h-10 w-full resize-none" rows="1" name="{{ widget.name }}-{{ case.0 }}" placeholder="Feedback for this case"{% if widget.attrs.disabled %} disabled{% endif %}>{{ value }}</textarea>
  </label>
  {% endfor %}
</div>
{% endif %}
