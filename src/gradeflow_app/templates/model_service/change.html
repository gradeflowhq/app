{# Opens the Choose models dialog, loading the endpoint's models with this device's token. #}
<button type="button" class="btn" data-dialog="model-chooser" hx-post="{% url 'model_service_dialog' %}" hx-target="#model-chooser-body" hx-swap="innerHTML">{% if state.fast_model or choosing_job %}Change{% else %}Choose models{% endif %}</button>
