{% extends "layouts/course.html" %}
{% block page_title %}Settings · {% endblock %}
{% block page %}
<c-page title="Settings">
  <div class="settings">
    <c-form-panel id="course-details" icon="information-circle" title="Details">{{ form }}</c-form-panel>
    <c-panel body_class="setting-rows">
      <c-setting-row icon="trash" label="Delete course" detail="Its assessments and their marks are deleted for everyone.">
        <form method="post" action="{% url 'delete_course' member.course_id %}">{% csrf_token %}<button class="btn btn-error btn-outline btn-sm" data-confirm="Delete “{{ member.course.name }}”?" data-confirm-detail="Its assessments and their marks are deleted for everyone." data-confirm-button="Delete">{% icon "trash" %}Delete</button></form>
      </c-setting-row>
    </c-panel>
  </div>
</c-page>
{% endblock %}
