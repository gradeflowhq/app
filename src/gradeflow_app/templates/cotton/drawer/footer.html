<c-vars submit="" />
{# A drawer's actions, kept in view at its bottom. With `submit`, Cancel and a primary button labelled `submit`, which takes any other attributes given. #}
<footer class="sticky bottom-0 mt-auto flex shrink-0 flex-wrap items-center justify-end gap-2 border-t border-base-300 bg-base-100 px-6 py-4">{{ slot }}{% if submit %}<button type="button" class="btn ml-auto" data-close>Cancel</button><button class="btn btn-primary" {{ attrs }}>{{ submit }}</button>{% endif %}</footer>
