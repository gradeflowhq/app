<c-vars href icon label sections />
<li><a href="{{ href }}" class="sidebar-link sm:max-xl:tooltip sm:max-xl:tooltip-right sm:max-xl:justify-center sm:max-xl:px-0 sm:max-xl:py-2" data-tip="{{ label }}" aria-label="{{ label }}"{% if section in sections.split %} aria-current="page"{% endif %}>{% icon icon "size-4 opacity-80 sm:max-xl:size-5" %}<span class="sm:max-xl:sr-only">{{ label }}</span></a></li>
