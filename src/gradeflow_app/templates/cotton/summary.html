<c-vars text />
{# What a marking does, in the core's words, set apart from the settings that change it. The core has words for complete settings only. #}
<div class="shaded-box">
  <p class="text-xs font-semibold text-muted">Summary</p>
  {% if text %}<c-collapsible class="prose-core mt-1.5">{{ text|markdown }}</c-collapsible>
  {% else %}<p class="mt-1.5 text-sm text-subtle">Finish the settings to see the summary.</p>{% endif %}
</div>
