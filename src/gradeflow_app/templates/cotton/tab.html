<c-vars href label icon sections count=None count_id=None />
{# A tab: current when the page's URL name is one of its `sections`, with a `count` when it isn't zero. `count_id`: the ID of its count, for responses that update it. #}
<a href="{{ href }}" class="tab-link"{% if request.resolver_match.url_name in sections.split %} aria-current="page"{% endif %}>{% icon icon %}{{ label }}{% if count %}<c-chip class="tabular-nums" :id="count_id">{{ count }}</c-chip>{% endif %}</a>
