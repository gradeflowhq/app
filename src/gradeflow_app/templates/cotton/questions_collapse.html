<c-vars class="" />
{# From 1,024 px, narrows the question list to its keys, or widens it again. #}
<button type="button" class="btn btn-ghost btn-square btn-sm -mr-2 max-lg:hidden questions-collapsed:mr-0{% if class %} {{ class }}{% endif %}" x-data="questionsCollapse" @click="toggle" :aria-expanded="!collapsed" :aria-label="collapsed ? 'Expand questions' : 'Collapse questions'" :title="collapsed ? 'Expand questions' : 'Collapse questions'" aria-controls="question-list">{% icon "chevron-left" "size-4 questions-collapsed:rotate-180" %}</button>
