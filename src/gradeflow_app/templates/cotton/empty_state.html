<c-vars icon title action="" class="" />
<div class="flex flex-col items-center px-6 py-14 text-center {{ class }}" {{ attrs }}>
  <span class="grid size-12 place-items-center rounded-full bg-base-200 text-muted">{% icon icon "size-6" %}</span>
  <p class="mt-4 font-semibold">{{ title }}</p>
  {% if slot %}<p class="mt-1 max-w-sm text-muted">{{ slot }}</p>{% endif %}
  {% if action %}<div class="mt-5">{{ action }}</div>{% endif %}
</div>
