<c-vars label detail="" />
{# A setting that is one action, such as Delete, Forget or Theme: its name and a short line on the left, its control on the right. #}
<div class="flex flex-wrap items-center justify-between gap-x-8 gap-y-3 py-4">
  <div class="min-w-0">
    <p class="font-medium">{{ label }}</p>
    {% if detail %}<p class="text-sm text-muted">{{ detail }}</p>{% endif %}
  </div>
  <div class="flex flex-wrap items-center gap-2">{{ slot }}</div>
</div>
