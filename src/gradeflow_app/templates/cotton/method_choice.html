<c-vars method guide_url />
{# A method to start marking with, as a row of a `method-choices` list. #}
<li class="relative">
  <button name="method" value="{{ method.ref }}" class="method-choice flex w-full py-3 pl-4 pr-12 text-left transition-colors hover:bg-base-200/60">
    <span class="min-w-0">
      <span class="flex flex-wrap items-center gap-2 font-medium">{{ method.label }}{% if method.needs_model_endpoint %}<c-ai-service />{% endif %}</span>
      <span class="mt-0.5 block text-sm text-muted">{{ method.summary }}</span>
    </span>
  </button>
  <button type="button" class="btn btn-ghost btn-square btn-sm absolute right-2 top-2.5 text-muted" hx-get="{{ guide_url }}?selected={{ method.ref|urlencode }}" hx-target="#picker-body" data-dialog="picker" aria-label="About {{ method.label }}">{% icon "question-mark-circle" "size-5" %}</button>
</li>
