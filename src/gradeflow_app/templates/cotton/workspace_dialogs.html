{# The drawer and the method picker that buttons load into: `#drawer-body` and `#picker-body`. #}
<dialog id="drawer" class="modal modal-end" aria-labelledby="drawer-title">
  <div tabindex="-1" class="modal-box outline-none relative flex h-full max-h-none w-full max-w-xl flex-col rounded-none border-y-0 border-r-0 p-0">
    <button type="button" class="btn btn-ghost btn-square btn-sm absolute right-3 top-2.5 z-10" data-close aria-label="Close">{% icon "x-mark" %}</button>
    <div class="flex min-h-0 flex-1 flex-col overflow-y-auto"><div id="drawer-body" class="flex flex-1 flex-col"></div></div>
  </div>
  <div class="modal-backdrop" data-close></div>
</dialog>
<c-dialog id="picker" body_id="picker-body" box_class="max-w-5xl" />
