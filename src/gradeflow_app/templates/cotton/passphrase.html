<c-dialog id="passphrase" title="Student ID passphrase" box_class="max-w-md">
  <form method="dialog" hx-boost="false" data-passphrase>
    <div class="grid gap-4 px-6 pt-2">
      <div class="grid gap-1.5">
        <input id="passphrase-input" name="passphrase" type="password" class="input w-full" autocomplete="off" aria-label="Passphrase" aria-describedby="passphrase-help">
        <p id="passphrase-help" class="text-sm text-muted">Student IDs are encrypted. Whoever imported the submissions can tell you the passphrase.</p>
        <p data-error hidden class="flex items-center gap-1.5 text-sm text-error">{% icon "exclamation-circle" "size-4" %}That passphrase doesn't open these IDs.</p>
      </div>
      <label class="flex cursor-pointer items-center gap-3"><input type="checkbox" name="remember" class="checkbox checkbox-sm checkbox-primary" checked><span>Remember on this device</span></label>
    </div>
    <c-dialog.footer submit="Show student IDs" />
  </form>
</c-dialog>
