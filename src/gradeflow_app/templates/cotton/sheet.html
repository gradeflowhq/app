<c-vars id />
<dialog id="{{ id }}" class="modal modal-end" aria-labelledby="sheet-title">
  <div tabindex="-1" class="modal-box outline-none relative flex h-full max-h-none w-full max-w-xl flex-col rounded-none border-y-0 border-r-0 p-0">
    <button type="button" class="btn btn-ghost btn-square btn-sm absolute right-3 top-2.5 z-10" data-close aria-label="Close">{% icon "x-mark" %}</button>
    <div class="flex min-h-0 flex-1 flex-col overflow-y-auto">{{ slot }}</div>
  </div>
  <div class="modal-backdrop" data-close></div>
</dialog>
