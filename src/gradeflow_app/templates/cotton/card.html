<c-vars title="" actions="" footer="" class="" body_class="p-5" />
<section class="card-box {{ class }}" {{ attrs }}>
  {% if title %}
    <header class="flex min-h-14 flex-wrap items-center justify-between gap-x-4 gap-y-1 border-b border-base-300 px-5 py-2">
      <h2>{{ title }}</h2>
      {% if actions %}<div class="flex items-center gap-2">{{ actions }}</div>{% endif %}
    </header>
  {% endif %}
  <div class="{{ body_class }}">{{ slot }}</div>
  {% if footer %}<footer class="flex flex-wrap items-center gap-3 border-t border-base-300 px-5 py-4">{{ footer }}</footer>{% endif %}
</section>
