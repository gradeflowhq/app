<c-vars id title="" action="" submit="Save" footer="" disabled_until_script=False />
{# A card that is one form, submitted from its footer, after anything in `footer`. Other attributes go on the card. #}
<c-card title="{{ title }}" :attrs="attrs">
  <form id="{{ id }}" method="post"{% if action %} action="{{ action }}"{% endif %} class="grid gap-5">{% csrf_token %}{{ slot }}</form>
  <c-slot name="footer">{{ footer }}<button form="{{ id }}" class="btn btn-primary ml-auto"{% if disabled_until_script %} disabled data-disabled-until-script{% endif %}>{{ submit }}</button></c-slot>
</c-card>
