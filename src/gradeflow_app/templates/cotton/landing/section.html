<c-vars id icon name title description="" />
{# A section of the landing page: its name as a chip, its heading and its description over `slot`. #}
<section id="{{ id }}" class="scroll-mt-4 px-4 py-12 sm:scroll-mt-0 sm:px-6 sm:py-16">
  <div class="mx-auto mb-10 grid max-w-4xl justify-items-center gap-4 text-center sm:mb-12">
    <c-chip icon="{{ icon }}">{{ name }}</c-chip>
    <h2 class="text-balance text-3xl font-semibold tracking-tight sm:text-[2.5rem]">{{ title }}</h2>
    {% if description %}<p class="max-w-2xl text-pretty text-lg text-muted">{{ description }}</p>{% endif %}
  </div>
  {{ slot }}
</section>
