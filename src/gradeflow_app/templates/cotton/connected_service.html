<c-vars icon label host_property confirm confirm_detail />
{# A service the person is connected to: `host_property`, the Alpine property naming it, and Disconnect, once confirmed. #}
<c-setting-row icon="{{ icon }}" label="{{ label }}">
  <c-slot name="status"><c-chip icon="check" tone="success"><span x-text="{{ host_property }}"></span></c-chip></c-slot>
  <button type="button" class="btn btn-error btn-outline btn-sm" x-on:click="disconnect" data-confirm="{{ confirm }}" data-confirm-detail="{{ confirm_detail }}" data-confirm-button="Disconnect">Disconnect</button>
</c-setting-row>
