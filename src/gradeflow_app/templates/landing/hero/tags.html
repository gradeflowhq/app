{# A list's values as Tom Select shows them (components/tag-input.js), with the field to type the next. #}
<div class="ts-wrapper input w-full multi plugin-remove_button" data-tag-input="{{ widget.name }}"><div class="ts-control">{% for value in widget.value %}<div class="item">{{ value }}<a class="remove">×</a></div>{% endfor %}<input type="text" size="1"></div></div>
