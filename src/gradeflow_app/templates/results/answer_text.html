{% with chips=answer|answer_chips:core_question %}
{% if blank or not answer %}<p class="italic text-muted">Blank</p>
{% elif chips %}{% include "results/answer_chips.html" %}
{% elif code %}<pre class="code-block"><code{% if not expanded %} class="line-clamp-4 group-open/answer:line-clamp-none"{% endif %}>{{ answer|highlight:code }}</code></pre>
{% else %}<p class="whitespace-pre-wrap wrap-break-word{% if not expanded %} line-clamp-4 group-open/answer:line-clamp-none{% endif %}">{% highlight_spans answer spans %}</p>{% endif %}
{% endwith %}
