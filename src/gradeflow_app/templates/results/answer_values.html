<ol class="flex flex-wrap gap-1.5" aria-label="Values">{% for label, value in values %}<li class="badge h-auto min-h-6 max-w-full border-base-300 font-medium wrap-break-word" title="{{ label }}">{% if value %}<span>{% highlight_spans value spans forloop.counter %}</span>{% else %}<span class="text-subtle">—</span>{% endif %}</li>{% endfor %}</ol>
