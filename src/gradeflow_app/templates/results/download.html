<c-dialog id="download" title="Download results">
  {% partialdef form inline %}
  <form method="post" action="{% url 'download' access.assessment.pk %}" data-decrypt hx-boost="false">
    {% csrf_token %}
    <div class="grid gap-4 px-6 pt-2">
      <c-more-options :open="download_form.is_bound">{{ download_form }}</c-more-options>
      <p class="flex gap-2 text-sm text-muted">{% icon "lock-closed" "size-4 mt-0.5" %}Student IDs are decrypted on this computer as the file downloads.</p>
    </div>
    <c-dialog.footer><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary">{% icon "arrow-down-tray" "size-4" %}Download</button></c-dialog.footer>
  </form>
  {% endpartialdef %}
</c-dialog>
