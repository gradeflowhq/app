<ol class="flex flex-wrap gap-1.5" aria-label="Values">{% for chip in chips %}<li class="badge h-auto min-h-6 max-w-full border-base-300 font-medium wrap-break-word{% if chip|length > 1 %} divide-x divide-base-300 px-0{% endif %}">{% for name, value, path in chip %}<span{% if chip|length > 1 %} class="px-2"{% endif %}>{% if name %}<span class="mr-1 font-normal text-muted">{{ name|lower }}</span>{% endif %}{% if value %}{% highlight_spans value spans path %}{% else %}<span class="text-subtle">—</span>{% endif %}</span>{% endfor %}</li>{% endfor %}</ol>
