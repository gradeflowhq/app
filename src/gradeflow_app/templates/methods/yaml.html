{# The whole method as YAML: to read, or in a draft to write. #}
<c-method-form action="{{ action }}">
  <c-drawer.head title="{% if workspace.editable %}Edit as YAML{% else %}YAML{% endif %}" />
  <c-drawer.yaml :text="text" label="Method as YAML" :editable="workspace.editable">{% if problem %}<c-alert>{{ problem }}</c-alert>{% endif %}</c-drawer.yaml>
  {% if workspace.editable %}<c-drawer.footer submit="Save" />{% endif %}
</c-method-form>
