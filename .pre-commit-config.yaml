# The project's own ruff, and CI's Biome, so hooks and CI agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: biome-check
        name: biome check
        entry: npx --yes @biomejs/biome@2.3.8 check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types_or: [javascript]
