# The web app, both workers and PostgreSQL. Settings come from .env.
x-app: &app
  image: ghcr.io/gradeflowhq/app:${GRADEFLOW_VERSION:-latest}
  pull_policy: always
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    GRADEFLOW_DATABASE_URL: postgres://gradeflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/gradeflow

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gradeflow
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gradeflow"]
      interval: 5s
      retries: 10

  # Migrates the database, then serves on port 8000.
  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 5s
      start_period: 5m

  # The workers start once the web app has migrated.
  db_worker:
    <<: *app
    command: python manage.py db_worker
    depends_on:
      web:
        condition: service_healthy

  job_worker:
    <<: *app
    command: python manage.py job_worker
    depends_on:
      web:
        condition: service_healthy

volumes:
  db:
